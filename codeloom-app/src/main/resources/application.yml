spring:
  application:
    name: codeloom

  # 默认激活 local，省去在 IDEA 运行配置里手填 SPRING_PROFILES_ACTIVE；忘记填的表现是
  # 应用起来了但连不上库，看起来像环境问题。profile 文件不存在不会报错，Spring 只是少读
  # 一份配置，所以别人 clone 下来没有 application-local.yml 时仍能启动。
  # 环境变量 SPRING_PROFILES_ACTIVE 优先级更高，部署时可以覆盖。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # application-local.yml 在 classpath（src/main/resources）上，激活 local 后从任何工作目录
  # 启动都读得到；它不会进 jar（pom 的 maven-jar-plugin 排除了它）。两条必须同时成立，
  # 理由见该文件开头。

  # agent 循环的瓶颈是阻塞等待 LLM 流式响应（IO 密集、长连接），虚拟线程让同步写法获得
  # 异步吞吐，因此不引入 WebFlux。
  threads:
    virtual:
      enabled: true

  # 主机名来自后面的 codeloom 段（db-host / redis-host）：换机器只改一处。
  # IDEA 直接启动时由不进版本库的 application-local.yml 赋值。
  #
  # 默认 localhost，保证任何人 clone 后都能零配置跑通：在 docs/deploy/middleware/
  # 执行 docker compose up 即可。其余占位符（端口、库名、账号、密码）默认也是本地那套。
  #
  # rewriteBatchedStatements=true 用于事件表的高频批量追加，不能删。
  datasource:
    url: jdbc:mysql://${codeloom.db-host}:${CODELOOM_DB_PORT:3306}/${CODELOOM_DB_NAME:codeloom}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${CODELOOM_DB_USER:root}
    password: ${CODELOOM_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: codeloom-pool
      maximum-pool-size: 20

  data:
    redis:
      host: ${codeloom.redis-host}
      port: ${CODELOOM_REDIS_PORT:6379}
      password: ${CODELOOM_REDIS_PASSWORD:root}
      database: 0
      timeout: 3s

  # 会话状态存 Redis，任一实例都能识别任一实例登录的会话，这是水平扩展的前提。
  # 见 docs/decisions/architecture/2026-09-24-two-realtime-channels-and-cookie-auth.md。
  #
  # 使用默认存储类型（RedisSessionRepository，一条 hash 加 TTL），不需要 Redis 的
  # keyspace 通知；换成 indexed 类型要在 Redis 侧开 notify-keyspace-events，那是一次
  # 部署配置改动，不能无声无息地依赖上。
  session:
    timeout: 12h
    redis:
      namespace: codeloom:session
      # immediate：属性写入时立即落 Redis，避免“Set-Cookie 已返回而会话还没写入”的窗口。
      # 默认的 on_save 在请求结束才写，窗口极小但确实存在，认证不该赌这个。
      flush-mode: immediate

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: ${CODELOOM_PORT:8080}

  servlet:
    session:
      cookie:
        # SameSite=Lax 是这套认证的安全前提，不是可选调优：跨站请求不会带上该 cookie，
        # 伪造的 POST 因而没有可冒用的权限，CSRF 不成立。这是 SecurityConfig 敢关闭 CSRF
        # 校验的原因；改动前先看那边的注释。理由见
        # docs/decisions/architecture/2026-09-24-two-realtime-channels-and-cookie-auth.md。
        #
        # HttpOnly 让脚本读不到 cookie；Secure 只在 HTTPS 下有意义，本地是 http，
        # 所以不设，部署时设为 true。
        same-site: lax
        http-only: true

codeloom:
  # ------------------------------------------------------------------
  # 中间件地址。默认 localhost，且这里是唯一的默认值：换机器只改这两行。
  # IDEA 直接启动时改的是 application-local.yml 里同名键（不进版本库）。
  # 环境变量优先：CODELOOM_DB_HOST / CODELOOM_REDIS_HOST。
  # ------------------------------------------------------------------
  db-host: ${CODELOOM_DB_HOST:localhost}
  redis-host: ${CODELOOM_REDIS_HOST:localhost}

  # 本实例标识，只用于排障：执行租约在 Redis 里的值以它开头，redis-cli 里能看出
  # 哪台机器拿着锁。上 k8s 时设为 pod 名。
  instance-id: ${CODELOOM_INSTANCE_ID:${random.uuid}}

  # 执行租约 TTL。续约间隔自动取三分之一；一次续约失败（或续约抛异常）就按失去执行权
  # 处理，不会重试，所以不能调得太小，否则跑构建的长工具调用会在中途失去锁。见
  # docs/decisions/architecture/2026-09-24-lease-and-fencing-token.md。
  lease-ttl: ${CODELOOM_LEASE_TTL:30s}

  # 进程内存里常驻的会话投影上限，条数与字节两条取先到的那条。超限时放下最久没用过的，
  # 下次用到再从事件流重建。字节上限不能省：500 轮和 2 轮的会话差几个数量级，
  # 只看条数等于没有内存边界。见
  # docs/decisions/architecture/2026-10-10-live-projections-get-a-cap.md。
  live-projections: ${CODELOOM_LIVE_PROJECTIONS:128}
  live-projections-bytes: ${CODELOOM_LIVE_PROJECTIONS_BYTES:32MB}

  # 崩溃恢复没有开关：启动时把执行到一半的工具调用补写成 ToolInterrupted，防止重放，
  # 到此为止，不自动接着跑。见
  # docs/decisions/architecture/2026-09-28-crash-recovery-writes-facts-not-resumes.md。

  # 模型 API Key 只有一处来源：用户在界面上配置，密钥按 (userId, provider) 加密存进
  # user_api_key 表，读写走 PUT/GET/DELETE /api/auth/api-key。后端没有开发用 key 的兜底，
  # 本地运行也要先在界面上配置。见
  # docs/decisions/architecture/2026-10-06-no-server-side-dev-key.md。

  # BYOK 主密钥：保护所有人的 API Key，base64 编码的 32 字节。刻意没有默认值，
  # 也不自动生成：自动生成的值下次重启就变，已经入库的密钥会全部解不开。
  #
  # 没配只是 BYOK 不可用，不拦启动；配了但格式错误（不是合法 base64、长度不对）
  # 会立刻启动失败。生成命令：openssl rand -base64 32
  # 见 docs/decisions/architecture/2026-09-28-secret-key-has-no-default.md。
  secret-key: ${CODELOOM_SECRET_KEY:}

  # ------------------------------------------------------------------
  # 文件系统上的路径。默认（留空）从项目根推导，而不是相对于当前工作目录：
  # 两者在启动方式不同时会给出不同答案，而库里的 repo_path 是绝对路径、两边都“能用”，
  # 界面上看不出来。
  #
  # 推导规则见 DataPaths：从工作目录向上找有 .git 的那层作为项目根，数据落在项目根下的
  # data/（见 .gitignore 的 data/ 条目）。锚点由代码决定，与启动方式、机器、clone 位置无关。
  # 找不到项目根（例如把 jar 拿到别处运行）直接启动失败，不悄悄换地方。
  # 见 docs/decisions/architecture/2026-09-29-data-path-anchor-fails-loud.md。
  # ------------------------------------------------------------------

  # 项目 git 仓库根目录，每个项目一个独立仓库。与 workspaces-root 是兄弟关系，
  # 不能互相嵌套：worktree 从项目仓库分出来，放进仓库里会被当成未跟踪文件。
  repos-root: ${CODELOOM_REPOS_ROOT:}

  # 工作区根目录，一棵树一个 worktree，按 ownerId、projectId 分两层。树挂在“人 × 项目”上
  # （见 WorkspaceId），同一人在同一项目里的所有会话共用一棵。
  workspaces-root: ${CODELOOM_WORKSPACES_ROOT:}

  git:
    executable: ${CODELOOM_GIT:git}
    # git 加固目录：一个空 hooks 目录加一个空全局配置。每次调用通过环境变量
    # GIT_CONFIG_GLOBAL / GIT_CONFIG_NOSYSTEM 把用户级和系统级配置指空，再用 -c 中和
    # core.hooksPath / core.fsmonitor 这类能执行命令或改变行为的配置项；diff 子命令另用
    # --no-ext-diff / --no-textconv 关掉外部 diff 与 textconv。
    #
    # 留空表示跟着 workspaces-root 走（放在工作区旁边）。它必须与 workspaces-root 绑定：
    # 独立写成相对路径时，workspaces-root 改成绝对路径后会留下第二份互不知情的加固目录。
    sandbox-dir: ${CODELOOM_GIT_SANDBOX:}

  # 免审批清单：列在这里的命令直接执行，其余命令会挂起等待批准。
  #
  # 它不是准入名单：不在里面的命令批准后照样能跑。收录的是高频且单一用途的操作，
  # 例如查看目录、构建、跑测试。
  #
  # 名单只匹配第一个词，看不见参数，所以是否动到工作区外另行判断：
  # rm / rmdir / mv / cp / mkdir / touch 的参数落在项目树外时仍会询问
  # （rm -rf node_modules 不问，rm -rf / 会问）。见 CommandPathScope。
  #
  # 另外两种情况也要询问：第一个词带路径（例如 ./gradlew、bin/mvn，指向另一个程序），
  # 以及整行命令无法可靠解析（含变量、命令替换、管道、重定向等展开后会变样的写法）。
  # 见 CommandLine。
  command-whitelist: ${CODELOOM_COMMAND_WHITELIST:ls,dir,pwd,cat,type,head,tail,wc,grep,rg,sort,uniq,diff,echo,mkdir,touch,rm,rmdir,mv,cp,git,mvn,gradle,npm,yarn,pnpm,node,npx,pytest,python,pip,javac,java,go,cargo,dotnet,make}

  # 跑命令使用的 shell。留空则自动查找（PATH 上的 bash，再兜几个常见位置）。
  #
  # 这是硬前提，不是优化：命令是整行文本（管道、重定向都是这一行的一部分），只有 shell
  # 能解释。找不到时 run_command 直接不可用，会明确报错，不会静默换一种方式执行。
  # 必须过 shell 的原因：名单里 ls、cat、rm、mv、cp 在 Windows 上都不是可执行文件，
  # 而模型最自然的写法就是这些名字。见
  # docs/decisions/architecture/2026-09-24-commands-are-whole-lines-through-bash.md。
  #
  # 不要写死路径：Git for Windows 可以装在任意盘符。需要指定时写 bash.exe 的绝对路径，
  # 或设置环境变量 CODELOOM_COMMAND_SHELL。
  command-shell: ${CODELOOM_COMMAND_SHELL:}

  # SSE 下行：浏览器订阅一条会话的事件流，实时观看对方的 AI 交互。
  stream:
    # 一条 SSE 连接的最长存活时间。到点由服务端主动断开，客户端带 Last-Event-ID 重连。
    # 主动断是因为长连接会被中间设备静默掐掉，自己决定何时断至少可预期。
    timeout: ${CODELOOM_STREAM_TIMEOUT:30m}

    # 重连补历史时每批从库里取多少条。分批拉到不满一批为止，避免重连风暴一次打满数据库。
    replay-batch: ${CODELOOM_STREAM_REPLAY_BATCH:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    # 默认 INFO，不要默认开 DEBUG：那一档下 MyBatis 会打印每条 SQL 的绑定参数，
    # 其中包含用户 API Key 的密文、口令哈希和事件 payload（整段会话正文）。
    # 需要看 SQL 时临时设置 LOGGING_LEVEL_COM_CODELOOM=DEBUG。
    # 见 docs/decisions/architecture/2026-10-10-log-level-defaults-to-info.md。
    com.codeloom: INFO
