# ================================================================
# codeloom 的 Redis 配置
# ================================================================

# ---------- 网络与认证 ----------
# 绑定 0.0.0.0 让宿主机上的应用能连接（容器网络下必须如此）。
# 安全性由 requirepass 和中间件所在网段共同保证，该网段在物理网络之外。
bind 0.0.0.0
protected-mode yes
port 6379

# 口令，仅供本地开发；对外部署前先改这一行，同时改 compose 里 redis 的 healthcheck。
requirepass root

# ---------- RDB 快照 ----------
# 三条规则取“或”：
#   900 秒内至少 1 次修改 / 300 秒内至少 10 次 / 60 秒内至少 10000 次
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ---------- AOF 追加日志 ----------
# everysec 表示每秒刷盘一次，崩溃最多丢 1 秒数据。
#
# 这个保证对本项目其实用不上：Redis 里全是易失数据（见下面的内存策略），
# 全丢也不会丢重要内容。但代价只是每秒一次 fsync，配上无妨。
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"

# ---------- 内存策略：本项目唯一与正确性相关的配置 ----------
#
# Redis 里放的全是易失数据：
#   · 执行租约（带 TTL 的锁）
#   · Pub/Sub 消息，含流式增量（fire-and-forget，不在 Redis 里留存）
#
# 但正因如此，绝不能让它淘汰 key：
# 一把被淘汰的锁 = 两个实例同时执行同一条会话 = 同一个 git worktree 被并发写。
#
# 所以必须是 noeviction：内存写满时报错，而不是静默淘汰。
# 见 docs/decisions/architecture/2026-09-25-redis-lock-needs-noeviction.md。
maxmemory 512mb
maxmemory-policy noeviction

# ---------- 日志 ----------
loglevel notice
