# ================================================================
# codeloom 的 Redis 配置
# ================================================================

# ---------- 网络与认证 ----------
# 绑 0.0.0.0 是为了让宿主机上的应用能连进来（容器网络下必须如此）。
# 安全性由 requirepass + 中间件所在的网段共同保证 —— 那个网段在物理网络之外。
bind 0.0.0.0
protected-mode yes
port 6379

# 口令（本地开发用；对外部署前先改这一行，连同 compose 里 redis 的 healthcheck）
requirepass root

# ---------- RDB 快照 ----------
# 三条规则取"或"：
#   900 秒内至少 1 次修改 / 300 秒内至少 10 次 / 60 秒内至少 10000 次
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ---------- AOF 追加日志 ----------
# everysec = 每秒刷盘一次，崩溃最多丢 1 秒数据。
#
# 说句实话：这个保证对本项目其实用不上 —— Redis 里存的全是易失数据
# （见下面"内存策略"那段的清单），全丢了也不会丢任何重要东西。
# 但代价只是每秒一次 fsync，配上也无妨。
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"

# ---------- 内存策略：本项目里唯一与【正确性】相关的配置 ----------
#
# Redis 里放的全是易失数据：
#   · 执行租约（带 TTL 的锁）
#   · Pub/Sub 消息（fire-and-forget）
#   · 流式增量缓冲（带 TTL，一轮结束后作废）
#
# 但正因如此，绝不能让它淘汰 key：
# 一把被淘汰掉的锁 = 两个实例同时执行同一条会话 = 同一个 git worktree 被并发写。
#
# 所以必须是 noeviction —— 内存写满时【报错】，而不是【静默淘汰】。
# 响亮地失败，远好于悄悄地把互斥性弄丢。
maxmemory 512mb
maxmemory-policy noeviction

# ---------- 日志 ----------
loglevel notice
